<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/meridian.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Meridian home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">MERIDIAN</span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="Main"></nav>
    <div class="topbar-right">
      <span class="reader" id="reader-name"></span>
      <span class="conn" id="conn" title="Live connection"><span class="dot"></span><span class="conn-label">Connecting</span></span>
      <span class="role-badge" id="role-badge"></span>
    </div>
  </header>
  <div class="devstrip" id="dev-switch" hidden>
    <label>Mock server · View as
      <select id="role-select" aria-label="View as role (mock server only)"></select></label>
    <span class="devstrip-note">Role switching exists only in the mock server.</span>
  </div>
  <div class="crumbbar"><ol class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></ol></div>
  <main id="page" class="page" tabindex="-1"></main>
</body>
</html>
