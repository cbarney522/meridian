<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Meridian</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/meridian.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">MERIDIAN</span>
    </div>
    <h1 id="login-title">Sign in</h1>
    <p class="login-reader" id="login-reader"></p>
    <form id="login-form" novalidate>
      <label class="field">
        <span class="field-label">User name</span>
        <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary login-btn" id="login-btn">Sign in</button>
    </form>
    <p class="login-foot" id="login-foot"></p>
  </main>
</body>
</html>
